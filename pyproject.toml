[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "IranSmartBIM"
version = "0.1.0"
description = "AI BIM Platform for Iranian Building Design"
readme = "README.md"
requires-python = ">=3.13"

authors = [
  {name = "IranSmartBIM Team"}
]

dependencies = [
    "PySide6",
    "fastapi",
    "uvicorn",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "sqlalchemy",
    "pydantic",
    "reportlab"
]

[tool.setuptools]
package-dir = {"" = "src"}